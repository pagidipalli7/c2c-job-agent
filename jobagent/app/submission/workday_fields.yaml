# Workday selector map. Workday is consistent about data-automation-id; each entry lists candidates in
# priority order. Edit here when a tenant deviates - never hardcode per company in the adapter.
apply:
  apply_button: ['a[data-automation-id="adventureButton"]', 'button[data-automation-id="adventureButton"]', 'a[data-automation-id="applyButton"]', 'button:has-text("Apply")']
  apply_manually: ['a[data-automation-id="applyManually"]', 'button[data-automation-id="applyManually"]', 'a:has-text("Apply Manually")', 'button:has-text("Apply Manually")']
auth:
  email: ['input[data-automation-id="email"]', 'input[type="email"]']
  password: ['input[data-automation-id="password"]', 'input[type="password"]']
  verify_password: ['input[data-automation-id="verifyPassword"]']
  create_account_checkbox: ['input[data-automation-id="createAccountCheckbox"]']
  create_account_link: ['button[data-automation-id="createAccountLink"]', 'a[data-automation-id="createAccountLink"]', 'button:has-text("Create Account")']
  sign_in_link: ['button[data-automation-id="signInLink"]', 'a[data-automation-id="signInLink"]', 'button:has-text("Sign In")']
  create_submit: ['button[data-automation-id="createAccountSubmitButton"]', 'button[data-automation-id="click_filter"]', 'button:has-text("Create Account")']
  sign_in_submit: ['button[data-automation-id="signInSubmitButton"]', 'button:has-text("Sign In")']
  otp_input: ['input[data-automation-id="verificationCode"]', 'input[data-automation-id="otpCode"]', 'input[autocomplete="one-time-code"]', 'input[name*="code" i]', 'input[aria-label*="code" i]']
  otp_submit: ['button[data-automation-id="verifyButton"]', 'button[data-automation-id="submitButton"]', 'button:has-text("Verify")', 'button:has-text("Continue")', 'button[type="submit"]']
  error: ['[data-automation-id="errorMessage"]', '[data-automation-id="alertMessage"]', '[role="alert"]']
nav:
  next: ['button[data-automation-id="bottom-navigation-next-button"]', 'button:has-text("Save and Continue")', 'button:has-text("Next")', 'button:has-text("Submit")']
  back: ['button[data-automation-id="bottom-navigation-back-button"]']
  progress: ['[data-automation-id="progressBar"]', '[data-automation-id="progressBarActiveStep"]']
  page_error: ['[data-automation-id="errorMessage"]', '[data-automation-id="alertMessage"]']
my_information:
  first_name: ['input[data-automation-id="legalNameSection_firstName"]', 'input[data-automation-id="firstName"]']
  last_name: ['input[data-automation-id="legalNameSection_lastName"]', 'input[data-automation-id="lastName"]']
  address_line1: ['input[data-automation-id="addressSection_addressLine1"]']
  city: ['input[data-automation-id="addressSection_city"]']
  state: ['button[data-automation-id="addressSection_countryRegion"]', 'select[data-automation-id="addressSection_countryRegion"]']
  postal_code: ['input[data-automation-id="addressSection_postalCode"]']
  country: ['button[data-automation-id="countryDropdown"]', 'select[data-automation-id="countryDropdown"]']
  phone_type: ['button[data-automation-id="phone-device-type"]', 'select[data-automation-id="phone-device-type"]']
  phone_number: ['input[data-automation-id="phone-number"]']
  source: ['button[data-automation-id="sourceSection"]', 'input[data-automation-id="source--source"]', 'button[data-automation-id="source--source"]']
  previous_worker_no: ['input[data-automation-id="previousWorker"][value="false"]', 'label:has-text("No") input[type=radio]']
my_experience:
  work_add: ['[data-automation-id="workExperienceSection"] button[data-automation-id="Add"]', 'button[data-automation-id="Add"]:near(:text("Work Experience"))', 'button:has-text("Add Work Experience")']
  work_add_another: ['[data-automation-id="workExperienceSection"] button[data-automation-id="Add Another"]', 'button[data-automation-id="Add Another"]']
  job_title: ['input[data-automation-id="jobTitle"]']
  company: ['input[data-automation-id="company"]']
  location: ['input[data-automation-id="location"]']
  current: ['input[data-automation-id="currentlyWorkHere"]']
  start_month: ['input[data-automation-id="dateSectionMonth-input"]']
  start_year: ['input[data-automation-id="dateSectionYear-input"]']
  description: ['textarea[data-automation-id="description"]']
  edu_add: ['[data-automation-id="educationSection"] button[data-automation-id="Add"]', 'button:has-text("Add Education")']
  school: ['input[data-automation-id="school"]', 'input[data-automation-id="schoolItem"]']
  degree: ['button[data-automation-id="degree"]', 'select[data-automation-id="degree"]']
  field_of_study: ['input[data-automation-id="fieldOfStudy"]', 'input[data-automation-id="field-of-study"]']
  resume_input: ['input[data-automation-id="file-upload-input-ref"]', 'input[type="file"]']
  linkedin: ['input[data-automation-id="linkedinQuestion"]']
  website: ['input[data-automation-id="website"]']
  skills: ['input[data-automation-id="skillsPrompt"]']
questions:
  container: ['[data-automation-id^="formField-"]']
disclosures:
  gender: ['button[data-automation-id="gender"]', 'select[data-automation-id="gender"]']
  ethnicity: ['button[data-automation-id="ethnicity"]', 'select[data-automation-id="ethnicity"]']
  hispanic: ['button[data-automation-id="hispanicOrLatino"]', 'select[data-automation-id="hispanicOrLatino"]']
  veteran: ['button[data-automation-id="veteranStatus"]', 'select[data-automation-id="veteranStatus"]']
  terms: ['input[data-automation-id="agreementCheckbox"]', 'input[type="checkbox"]:near(:text("terms"))']
self_identify:
  name: ['input[data-automation-id="name"]']
  date_month: ['input[data-automation-id="dateSignedOn-dateSectionMonth-input"]']
  date_day: ['input[data-automation-id="dateSignedOn-dateSectionDay-input"]']
  date_year: ['input[data-automation-id="dateSignedOn-dateSectionYear-input"]']
  disability_options: ['[data-automation-id="disabilityStatus"] input, [data-automation-id^="disabilityStatus"]']
confirmation:
  text: ['congratulations', 'application has been submitted', 'thank you for applying', 'successfully submitted', 'you have applied']
