# Company registry seed. Edit freely, then `python scripts/seed.py` (idempotent).
# Either give slug + ats, or just a careers URL and let detect_ats() figure it out.
# ats: greenhouse | lever | ashby | smartrecruiters | workday (workday needs the full careers url).
# LinkedIn / Indeed / Glassdoor / ZipRecruiter URLs are rejected on purpose.
#
# Workday tenants are searched with each of WORKDAY_SEARCH_TERMS (see .env / config.py), so large tenants
# like Accenture return the Power Platform / data roles rather than the first 100 postings.
